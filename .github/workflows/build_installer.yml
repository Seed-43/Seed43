name: Build Seed43 Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(head -1 version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Prepare installer files
        shell: powershell
        run: |
          # Copy Seed43.extension into the installer folder so NSIS can bundle it
          Copy-Item -Path "Seed43.tab" -Destination "installer\Seed43.extension\Seed43.tab" -Recurse
          # Copy root extension files
          $rootFiles = @("extension.json", "Seed43.png", "startup.py", "version.txt", "seed43_migrations.yaml")
          foreach ($f in $rootFiles) {
            if (Test-Path $f) {
              Copy-Item $f "installer\Seed43.extension\"
            }
          }
          # Copy lib and UI folders if they exist
          if (Test-Path "lib") { Copy-Item -Path "lib" -Destination "installer\Seed43.extension\lib" -Recurse }
          if (Test-Path "UI")  { Copy-Item -Path "UI"  -Destination "installer\Seed43.extension\UI"  -Recurse }

      - name: Build installer
        shell: powershell
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          & $makensis /DVERSION=${{ steps.version.outputs.version }} installer\Seed43_Installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seed43_Install_${{ steps.version.outputs.version }}
          path: installer\Seed43_Install.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Seed43 v${{ steps.version.outputs.version }}
          body: |
            ## Seed43 v${{ steps.version.outputs.version }}

            ### Installation
            1. Download `Seed43_Install.exe` below
            2. Run the installer
            3. Open Revit and reload pyRevit

            ### Requirements
            - pyRevit 4.8+
            - Autodesk Revit 2022+

            See [seed43.org](https://seed43.org) for full documentation.
          files: installer\Seed43_Install.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
