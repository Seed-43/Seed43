title: "Center In View"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Moves the elements of a drafting view or legend so a point you pick lands
  on the view's centre point, which is its origin. Run it in the view, pick
  the point on the elements that should sit at the centre (endpoints,
  midpoints, intersections and centres snap), and everything moves by the
  same amount so the layout is untouched. The view title of any viewport
  showing the view is then reset to its default position, as if the view
  had just been placed on the sheet. That makes it ideal for lining views
  up with Saved Position, because views that share the same centre point
  land in exactly the same place when you place them on sheets. If you
  have elements selected only those move, otherwise every element drawn in
  the view does. Pinned elements and viewports are unpinned for the move
  and pinned again afterwards, and the whole thing is one undo.

  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
