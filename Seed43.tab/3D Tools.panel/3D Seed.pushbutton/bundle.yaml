title: "3D Seed"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Exports the active 3D view to a .seed file for Seed43 Studio as a smart
  model: Revit's own IFC exporter, with every instance and type
  parameter (built-in, project and shared) as property sets, plus the
  IFC common sets and quantities. What the view shows is what you get.
  Coordinates are the shared coordinates, so it lines up with a
  Navisworks export of the same model. Studio opens it as a full IFC.

  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
