title: "Isolate Levels"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: |
  __________________________________________________________________
  Description:
  Temporarily isolates all model elements on a chosen level in the
  active view. Pick a level from the list and the view will show only
  elements that belong to that level. Use Revit's "Reset Temporary
  Hide/Isolate" button to clear.
  __________________________________________________________________
