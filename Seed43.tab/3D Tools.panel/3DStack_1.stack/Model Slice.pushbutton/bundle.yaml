title: "Model Slice"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Sets the 3D view's section box to a thin slice of the model, 500mm
  either side of a level or grid line. A window lists every level and
  grid: type part of the name and press Enter, or choose Select in model
  and click a level or grid line. A level gives a horizontal slice across
  the plan extent of the grids, a grid gives a vertical slice along it,
  rotated to follow skewed grids, from the lowest to the highest level.
  A level or grid selected before running is used straight away. Clear it
  with the section box toggle in view properties.

  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
