title: "Grid"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: |
  __________________________________________________________________
  Description:
  Sets the 3D view's section box to a vertical slice of the model along
  a chosen grid - 500mm either side of the grid line, the full length
  of the grid and the full height of the model. The box rotates to
  follow the grid, so skewed grids work too. Select a grid first, pick
  one from the list, or click one in the model. Clear it with the
  section box toggle in view properties.
  __________________________________________________________________
