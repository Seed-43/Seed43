title: "Level"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: |
  __________________________________________________________________
  Description:
  Sets the 3D view's section box to a horizontal slice of the model at
  a chosen level - 500mm above and below the level line, across the
  full plan extent of the model. Select a level first, pick one from
  the list, or click one in the model. Clear it with the section box
  toggle in view properties.
  __________________________________________________________________
