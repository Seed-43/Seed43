title: "Beam Rebar"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Places concrete beams with their reinforcing, or adds the reinforcing to
  beams already in the model. Choose a rebar layout (a closed stirrup, a
  stirrup with centre links, overlapping stirrups for a wide beam, two U
  bars lapped, or a flat link round the bottom bars of a slab thickening),
  then the bars top, bottom and on the faces, the covers, and the stirrup
  spacing with optional closer end zones. Apply: click the start and end of
  each new beam; a type of that size is made if the family has none.
  Reinforce existing beams: pick beams already in the model, each is set
  out from its own concrete as cut.

  Update reads a beam's size and level into the dialogue; Apply then
  replaces its bars. Stirrups go in at a maximum spacing and the bar rows
  as a fixed number, so tags read the spacing and the count. One undo.

  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
