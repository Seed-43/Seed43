title: "3D Seed"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Exports the active 3D view to a .seed file for Seed43 Studio, the same
  file Navisworks' Export to Studio makes. What the view shows is what
  you get: visibility, filters, the section box and linked models all
  carry through. Studio opens it with a model, category and type tree,
  Revit material colours and see-through glass, each element's
  properties, and the Revit view's camera. Coordinates are the shared
  coordinates, so it lines up with a Navisworks export of the same model.

  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
