title: "Filter Element (Host)"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: |
  __________________________________________________________________
  Description:
  Creates View Filters for host model elements based on the selected
  element's category and type name. Applies the filter to the active
  view or its template and hides matching elements - built for fast
  isolation and control of model elements by type.
