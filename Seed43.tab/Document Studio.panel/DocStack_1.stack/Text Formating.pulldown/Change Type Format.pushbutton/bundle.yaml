title: "Change Type &/ Format"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: |
  𝐕𝐄𝐑𝐒𝐈𝐎𝐍 260520
  _____________________________________________________________________
  Description:
  Batch updates Text Notes across the project by changing their Text Type and applying formatting.
  
  - Change Text Type (optional)
  - Apply formatting:
      - Bold
      - Italic
      - Underline
  - Works across the entire project
  
  Worksharing support:
  - Automatically checks out required elements
  - Handles worksets safely
  - Optional sync with central
  
  Useful for:
  - Global text standardisation
  - QA cleanup
  - Fixing inconsistent annotation styles
  _____________________________________________________________________
  How-to:
  -> Run the tool
  -> Select SOURCE
  -> Select TARGET
  -> Select formatting options (optional)
  
  -> Tool will:
      - Update all matching Text types
  
  Note:
  - Formatting can be applied without changing type
  - Type can be changed without applying formatting
  _____________________________________________________________________
  Last update:
  - Updated to use pyrevitlib  _____________________________________________________________________
