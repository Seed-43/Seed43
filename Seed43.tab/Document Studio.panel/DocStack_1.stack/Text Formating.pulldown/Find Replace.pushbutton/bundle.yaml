  Description:
  Find and replace text strings inside Revit Text Notes.

  Scope options:
  - Selected Text Notes (pick in canvas)
  - Active View Only
  - Entire Project

  Match options:
  - Case-Sensitive
  - Case-Insensitive

  Leave the Replace field blank to delete the matched text entirely.
