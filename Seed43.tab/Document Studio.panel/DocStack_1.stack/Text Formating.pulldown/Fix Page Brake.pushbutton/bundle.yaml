title: "Fix Page Break"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: |
  𝐕𝐄𝐑𝐒𝐈𝐎𝐍 260521
  _____________________________________________________________________
  Description:
  Text Notes that contain embedded newline characters (hard returns typed with Enter) are replaced with a space or removed entirely.

  This fixes text notes that have breaks across lines unexpectedly due to a hidden newline in the string rather than a narrow text box.

  Options:
  - Scope: Active View Only or Entire Project
  - Replace newline with a single space, or remove it completely

  Safe to run on workshared models.
  _____________________________________________________________________
  How-to:
  -> Run the tool
  -> Choose scope (active view or whole project)
  -> Choose what to replace the newline with
  -> Confirm, and the fix is applied in a single transaction

  Note:
  - Double spaces produced by the replacement are automatically
    collapsed to a single space
  - Leading and trailing whitespace is trimmed from each fixed note
  - Elements that cannot be edited are skipped and reported
  _____________________________________________________________________
  Last update:
  - Initial release
  _____________________________________________________________________

