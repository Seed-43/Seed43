title: "Match Text Width"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Copies the text box width from a reference Text Note to one or more target
  Text Notes, for a consistent annotation layout across views. Only the box
  width changes - text content and formatting are untouched.

  __________________________________________________________________
