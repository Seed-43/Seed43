title: "Xplode"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: |
  _____________________________________________________________________
  Description:
  Breaks one or more multi-line Text Notes into individual single-line Text Notes, stacked at the same position as the original.
  Each line of text becomes its own independent Text Note. The original note is removed and replaced with the split result.
  _____________________________________________________________________
