title: "Check Temp Overrides"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: |
  _____________________________________________________________________
  Description:
  Scans all views placed on sheets and reports any that have active temporary graphic overrides. Results are grouped by sheet with clickable links to navigate directly to the sheet or view.
  Detects:
  - Hide/Isolate (temporarily hide or isolate active)
  - Reveal Hidden Elements mode
  - Worksharing Display mode

  Output:
  - Sheet number and name with a clickable link to open the sheet
  - View name with a clickable link and override type shown in amber
  - ALL CLEAR message if no overrides are found
  _____________________________________________________________________
