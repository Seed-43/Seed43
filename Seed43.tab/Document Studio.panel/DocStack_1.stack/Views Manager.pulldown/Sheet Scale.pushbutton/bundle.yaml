title: "Sheet Scale"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Shows the real view scales on sheets whose Scale reads As indicated.

  Current Sheet / All Sheets: the view scales on each As indicated sheet
  are written 1:1, smallest first, into the sheet's Scale_Override and
  the title block's Override Scale is turned on, so the title block shows
  them in place of "As indicated". Every other sheet has Scale_Override
  cleared and Override Scale turned off, so it shows Revit's own scale.
  Current Sheet also takes sheets selected in the Project Browser.
  Legends are left out, and so are viewports whose type name holds
  No Scale, N.T.S, No Title or None.

  Set Up Title Blocks (Revit 2026): run once per project. Every title
  block family in use gets a Scale_Override label laid exactly over its
  scale label, an Override Scale switch, and Bool 01 (not Override Scale)
  on the scale label, so only one of the two shows. The family is loaded
  back into the project and closed without saving. Scale_Override is
  added to the project's sheets if missing. Title blocks already set up,
  or with no scale label, are skipped. Sheets whose title block is not
  set up are left alone and listed in the report.

  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
