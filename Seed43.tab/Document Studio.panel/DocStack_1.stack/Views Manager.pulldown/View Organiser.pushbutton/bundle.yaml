title: "View Organiser"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Renames every view placed on a sheet into a consistent Sheet Number -
  Detail Number - View Title format across the project in one automatic
  pass. You choose up to ten links per section, each copying a sheet
  parameter (such as Folder or Sheet Collection) to a parameter on the
  views, schedules or legends placed on that sheet. Sections are asked in
  turn, and anything the saved setup lacks after an update is asked again.

  __________________________________________________________________
