title: "Seed Import"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Imports a model into Revit, working out what to do from the file. A
  steel fabrication IFC (Tekla Structures, ProStructures) becomes native
  framing, braces and columns, Revit steel plates, bolts and anchors,
  with sections matched to your family types and anything unmatched put
  to you to map; your choices are remembered. A .seed from 3D Seed or
  Navisworks' Export to Studio comes in as shapes, one per element, and
  a .seed that holds an IFC is imported as that IFC. A report lists what
  became what and anything that needs checking.

  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
