title: "pyLink"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: |
  __________________________________________________________________
  Description:
  Links Excel and Word documents to Revit views. Drop a file in and
  each named range or document section becomes a Legend, Schedule, or
  Drafting view inside your project, built from real Revit data, not
  an image. Excel named ranges carry over cell values, fonts,
  colours, and borders. Word documents are split by heading into
  sections, each becoming a Legend or Drafting view arranged into
  columns you choose. Views that already exist by the same name
  prompt to overwrite or skip, and any row whose source content
  changes after being applied is flagged so you know it needs
  reapplying.
  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
