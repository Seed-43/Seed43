title: "pyRecent"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Lists the project files you have opened, newest first, with a thumbnail,
  the Revit version and a history of the days each was opened. Double-click
  a file to open it, in its own Revit version where that is installed. A
  file opened and closed without being saved is marked Reference, and the
  Options tab can limit tracking to chosen folders, such as every job's
  DRAWINGS\STRUCTURAL folder, so linked and other teams' files stay off the
  list.

  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
