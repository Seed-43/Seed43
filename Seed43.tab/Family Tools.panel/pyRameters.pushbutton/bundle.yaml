title: "pyRameters"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Parameters in two tabs.

  Parameters lists every parameter in the open model or family in one
  grid. Add them from a shared file, or as new family parameters; rename,
  switch instance and type, change the group, set categories, values and
  formulas, convert between family and shared, or delete. Every change is
  marked and waits until Apply, which writes them all in one transaction,
  so Revit's Undo takes the whole batch back in one step.

  Shared file edits a Revit shared parameter file as a table, the way a
  spreadsheet would, without the file ever having to be opened by hand. Open any
  file or load the one Revit is currently pointed at, edit the cells,
  then add, duplicate, delete, rename or regroup whole selections at
  once.

  Save checks the file before it writes it. A duplicate or malformed
  GUID, an empty name, a group that is not in the table or a tab pasted
  into a field all stop the save and mark the rows in red, because Revit
  matches a shared parameter by its GUID alone and a file that gets that
  wrong quietly unbinds every family using it.

  The write itself is the careful part. The old file is copied into a
  _backups folder beside it, the new one is written to one side and then
  moved into place, so a save that is interrupted leaves either the old
  file whole or the new one whole and never half of either.

  Values are carried through as they were found. The column order is
  read from the file rather than assumed, so a file from an older Revit
  parses into the right fields, and a value the tool does not recognise
  is left alone unless that cell is edited.

  The Shared file tab never touches the model and starts no transaction.
  Its Undo steps back through edits to the table.

  __________________________________________________________________
min_revit_ver: 2022
max_revit_ver: 2026
