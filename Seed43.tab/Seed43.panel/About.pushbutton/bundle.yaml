title: "𝑨𝒃𝒐𝒖𝒕"
author: "𝐒𝐄𝐄𝐃𝟒𝟑"
tooltip: >
  __________________________________________________________________

  Description:

  Opens the Seed43 About window. From here, you can check which version of
  the Seed43 toolbar is installed, see what has changed in the latest
  version, and update to the newest version with one click. You can also
  toggle individual tools and panels on or off directly from this window. An
  internet connection is required to check for and download updates, and
  pyRevit needs to be reloaded after updating for the changes to take
  effect.

  __________________________________________________________________
