snippets:

  _dialogs.py:
    description: >
      Themed message/confirm/text-input popups: borderless rounded dark card
      with a green accent bar and drop shadow, no native title bar,
      drag-movable by clicking anywhere on the card. The one popup style
      every Seed43 tool should use instead of building its own message box.
      Used by pySheets.
    functions:
      message:    Show a themed OK-only info popup.
      confirm:    Show a themed yes/cancel popup, returns True on yes.
      ask_string: Show a themed single-line text prompt, returns the string or None on cancel.

  _filters.py:
    description: >
      Shared helpers for creating and applying Revit view filters.
      Used by all Filter Manager tools.
    functions:
      find_existing_filter:      Search the project for a filter by name.
      get_unique_filter_name:    Return a unique filter name, appending a counter if needed.
      view_template_controls_filters: Check if the view template controls the filter setting.
      apply_filter_to_target:    Add and hide a filter on the active view or its template.
      create_parameter_filter:   Create a string-equals ParameterFilterElement.
      create_category_filter:    Create a category-only filter matching every element in a category.

  _icons.py:
    description: >
      Vector icon rendering for Seed43 panels and scripts. Icons are drawn
      as sharp scalable shapes from _icons.json, not bitmaps, so they stay
      crisp at any size. Used by pyTransmit.
    functions:
      make_icon:            Return a Viewbox containing the named icon at a given size and color.
      make_icon_with_label: Return a horizontal StackPanel with an icon and a text label beside it.
      icon_keys:            Return a sorted list of all available icon key names.

  _migrations.py:
    description: >
      Reads seed43_migrations.yaml and copies user .json config from renamed
      tool folders to their new location before the updater syncs, so saved
      settings survive a rename. Used by startup.py and About.
    functions:
      read_migrations:  Parse seed43_migrations.yaml into a list of migration dicts.
      apply_migrations: Copy .json config from each old folder path to its new one.

  _parameters.py:
    description: >
      Shared helpers for reading/writing Revit parameters (unit-aware via
      SetValueString/AsValueString) and collecting categories/schedules.
      Used by PyTable.
    functions:
      get_param_display_value:      Return a parameter's value as display text.
      set_param_from_display_value: Write display text back to a parameter.
      get_categories_with_elements: Return categories that have at least one placed element.
      get_elements_by_category:     Return all instances (not types) in a category.
      get_schedules:                Return all non-template ViewSchedules in the project.
      get_param_dropdown_options:   Return valid options for a constrained parameter, or None.

  _revisions.py:
    description: >
      Shared helpers for working with Revit revisions and the filter backup system.
      Used by Persistent Revisions, Revision Status Colour, Filter Delete and Backup,
      and Filters Restore.
    functions:
      get_revision_description:  Return the user-visible description of a revision.
      safe_str:                  Convert a .NET string to a safe Python string.
      get_backup_path:           Return the path for the filter backup JSON file next to the model.
      load_backup:               Load a backup JSON file and return it as a dict.
      save_backup:               Write a dict to disk as a JSON backup file.

  _userdata.py:
    description: >
      Per-tool user settings under a single .user folder at the extension
      root, so the updater never has to protect scattered .json files.
      Migrates a tool's legacy beside-the-script file across on first run.
    functions:
      user_root: Return the .user folder, creating it if needed.
      user_path: Return a path inside .user/<tool>/, creating parent folders.
      migrate:   Move a legacy file into .user once, then delete the original.

  seed43_theme.py:
    description: >
      Loads seed43_palette.json and injects the colour and sizing resources
      every Seed43 window's XAML references via DynamicResource. Must be
      called AFTER the XAML has loaded, or the injected values lose to the
      window's own Setters. Used by every WPF tool in the extension.
    functions:
      load_palette:            Return the full parsed palette dict, or None if not found/unreadable.
      get_active_profile:      Return 'dark' or 'light', defaulting to 'dark'.
      get_color:               Return the hex string for a semantic palette key, read straight from the JSON.
      apply_seed43_palette:    Inject SolidColorBrush resources into window.Resources.
      apply_seed43_dimensions: Inject sizing resources (Thickness/CornerRadius/double) into window.Resources.
      set_active_profile:      Write a new active_profile ('dark'/'light') back to the JSON on disk.
      set_accent:              Set a new accent colour, deriving hover/pressed/border shades from it.

  _selection.py:
    description: >
      Shared helpers for picking and resolving elements in Revit.
      Used by Filter Manager, CAD Layer Manager, and Isolate Levels.
    functions:
      get_element_type:          Return the ElementType for a given element.
      get_element_type_linked:   Return the ElementType for an element in a linked document.
      get_element_category:      Return the Category for an element, falling back to its type.
      resolve_cad_instance:      Return the CAD ImportInstance to work with, from selection or pick.
      get_levels:                Return all levels in the project.
