<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seed43 Palette Editor</title>
<style>
  :root {
    --editor-bg: #1E2530;
    --editor-panel: #232933;
    --editor-border: #333B48;
    --editor-text: #F4FAFF;
    --editor-muted: #8B96A5;
    --editor-accent: #208A3C;
    --editor-accent-hover: #2B933F;
    --editor-accent-pressed: #1A6E2E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--editor-bg);
    color: var(--editor-text);
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--editor-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--editor-accent); }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--editor-panel);
    border: 1px solid var(--editor-border);
    border-radius: 8px;
    padding: 4px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--editor-muted);
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.1s ease;
  }
  .tab-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--editor-text);
  }
  .tab-btn:active {
    background: rgba(255,255,255,0.12);
  }
  .tab-btn.active {
    background: var(--editor-accent);
    color: #fff;
  }
  .tab-btn.active:hover {
    background: var(--editor-accent-hover);
  }
  .tab-btn.active:active {
    background: var(--editor-accent-pressed);
  }
  main {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 0;
    height: calc(100vh - 73px);
    overflow: hidden;
  }
  .editor-col {
    padding: 24px 28px;
    overflow-y: auto;
    height: 100%;
    scrollbar-width: thin;
    scrollbar-color: var(--editor-accent) transparent;
  }
  .editor-col::-webkit-scrollbar,
  .preview-col::-webkit-scrollbar {
    width: 8px;
  }
  .editor-col::-webkit-scrollbar-track,
  .preview-col::-webkit-scrollbar-track {
    background: transparent;
  }
  .editor-col::-webkit-scrollbar-thumb,
  .preview-col::-webkit-scrollbar-thumb {
    background: var(--editor-accent);
    border-radius: 3px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .editor-col::-webkit-scrollbar-thumb:hover,
  .preview-col::-webkit-scrollbar-thumb:hover {
    background: var(--editor-accent-hover);
    background-clip: padding-box;
  }
  .editor-col::-webkit-scrollbar-thumb:active,
  .preview-col::-webkit-scrollbar-thumb:active {
    background: var(--editor-accent-pressed);
    background-clip: padding-box;
  }
  .group {
    margin-bottom: 26px;
  }
  .group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--editor-muted);
    margin-bottom: 10px;
    font-weight: 700;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--editor-panel);
    border: 1px solid var(--editor-border);
    margin-bottom: 6px;
  }
  .row label {
    flex: 1;
    font-size: 13px;
    color: var(--editor-text);
  }
  .row .key-name {
    display: block;
    font-size: 10px;
    color: var(--editor-muted);
    font-family: "SF Mono", Consolas, monospace;
  }
  .swatch-wrap {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 6px;
    border: 1px solid var(--editor-border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .swatch-wrap input[type=color] {
    position: absolute;
    top: -4px; left: -4px;
    width: 42px; height: 42px;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .hex-input {
    width: 90px;
    background: #12161d;
    border: 1px solid var(--editor-border);
    color: var(--editor-text);
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 5px;
    text-align: center;
  }
  .num-input {
    width: 70px;
    background: #12161d;
    border: 1px solid var(--editor-border);
    color: var(--editor-text);
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 5px;
    text-align: center;
  }
  .num-unit {
    font-size: 11px;
    color: var(--editor-muted);
    width: 18px;
  }
  .icon-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px;
    background: var(--editor-panel);
    border: 1px solid var(--editor-border);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .icon-preview {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    background: #12161d;
    border: 1px solid var(--editor-border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-preview svg { width: 22px; height: 22px; }
  .icon-fields {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .icon-fields-row {
    display: flex;
    gap: 6px;
  }
  .icon-key-input, .icon-desc-input {
    flex: 1;
    background: #12161d;
    border: 1px solid var(--editor-border);
    color: var(--editor-text);
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 5px;
    min-width: 0;
  }
  .icon-key-input { font-family: "SF Mono", Consolas, monospace; color: var(--editor-accent); }
  .icon-path-input {
    width: 100%;
    background: #12161d;
    border: 1px solid var(--editor-border);
    color: var(--editor-text);
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 5px;
    resize: vertical;
    min-height: 32px;
  }
  .icon-delete-btn {
    background: transparent;
    border: 1px solid var(--editor-border);
    color: var(--editor-muted);
    width: 26px;
    height: 26px;
    border-radius: 5px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-delete-btn:hover {
    border-color: #C53030;
    color: #C53030;
  }
  #icon-search {
    width: 100%;
    background: #12161d;
    border: 1px solid var(--editor-border);
    color: var(--editor-text);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .reset-btn {
    background: transparent;
    border: 1px solid var(--editor-border);
    color: var(--editor-muted);
    width: 26px;
    height: 26px;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .reset-btn:hover {
    color: var(--editor-text);
    border-color: var(--editor-accent);
  }
  .reset-btn:active {
    background: rgba(255,255,255,0.08);
    border-color: var(--editor-accent-hover);
  }
  .reset-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .preview-col {
    background: var(--editor-panel);
    border-left: 1px solid var(--editor-border);
    padding: 24px;
    height: 100%;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--editor-accent) transparent;
  }
  .preview-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--editor-muted);
    margin-bottom: 14px;
    font-weight: 700;
  }
  #toolname-editor {
    margin-bottom: 16px;
    padding: 10px;
    background: var(--editor-bg);
    border: 1px solid var(--editor-border);
    border-radius: 8px;
  }
  .toolname-label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--editor-muted);
    margin-bottom: 6px;
  }
  .toolname-inputs {
    display: flex;
    gap: 6px;
  }
  .toolname-input {
    flex: 1;
    min-width: 0;
    background: #12161d;
    border: 1px solid var(--editor-border);
    color: var(--editor-text);
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 5px;
  }
  .toolname-input:first-child {
    color: var(--editor-accent);
    font-weight: 600;
  }
  #component-list-wrap {
    margin-bottom: 16px;
    padding: 10px;
    background: var(--editor-bg);
    border: 1px solid var(--editor-border);
    border-radius: 8px;
  }
  #component-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .component-chip {
    background: var(--editor-panel);
    border: 1px solid var(--editor-border);
    color: var(--editor-text);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.1s ease, border-color 0.1s ease;
  }
  .component-chip:hover {
    border-color: var(--editor-accent);
  }
  .component-chip.active {
    background: var(--editor-accent);
    border-color: var(--editor-accent);
    color: #fff;
    font-weight: 600;
  }
  @keyframes component-pulse {
    0%   { outline-color: var(--editor-accent); outline-offset: 4px; }
    50%  { outline-color: var(--editor-accent); outline-offset: 8px; }
    100% { outline-color: var(--editor-accent); outline-offset: 4px; }
  }
  .component-highlighted {
    outline: 3px solid var(--editor-accent);
    outline-offset: 4px;
    border-radius: 6px;
    animation: component-pulse 1.1s ease-in-out infinite;
    position: relative;
    z-index: 5;
  }
  .row.token-highlighted {
    background: rgba(255,255,255,0.05);
    outline: 2px solid var(--editor-accent);
    outline-offset: -1px;
  }
  #preview-window {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #000;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #preview-footer {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    position: relative;
  }
  #preview-footer-text {
    font-size: 10px;
    opacity: 0.55;
  }
  #preview-footer-grip {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    position: absolute;
    right: 2px;
    bottom: 2px;
  }
  #preview-footer-grip rect {
    opacity: 0.35;
  }
  #preview-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 16px;
    position: relative;
    z-index: 1;
    box-sizing: border-box;
  }
  #topbar-title {
    font-size: 13px;
    font-weight: 600;
  }
  #topbar-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #topbar-menu-wrap {
    position: relative;
  }
  #topbar-menu {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--tb-menu-bg, transparent);
    transition: background 0.1s ease;
  }
  #topbar-menu:hover {
    background: var(--tb-menu-hover, rgba(255,255,255,0.12));
  }
  #topbar-menu:active {
    background: var(--tb-menu-active, rgba(255,255,255,0.22));
  }
  /* Open state (IsChecked=True in the real ToggleButton) - a distinct
     persistent state, not the same as the transient :active mouse-press
     pseudo-class above. Matches LocalHamburgerToggle's IsChecked trigger:
     accent fill while the menu is open. */
  #topbar-menu.open {
    background: var(--tb-menu-open, var(--editor-accent)) !important;
  }
  #topbar-menu-popup {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 200px;
    padding: 4px;
    flex-direction: column;
    z-index: 10;
  }
  #topbar-menu-popup.open {
    display: flex;
  }
  .pv-menu-item {
    display: flex;
    align-items: center;
    border: none;
    background: transparent;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s ease;
  }
  .pv-menu-item:hover {
    background: var(--menu-item-hover-bg);
    color: var(--menu-item-hover-fg, #fff);
  }
  .pv-menu-item:active {
    background: var(--menu-item-pressed-bg, var(--menu-item-hover-bg));
  }
  #topbar-close {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--tb-close-bg, transparent);
    transition: background 0.1s ease;
  }
  #topbar-close:hover {
    background: var(--tb-close-hover, rgba(255,255,255,0.12));
  }
  #topbar-close:active {
    background: var(--tb-close-active, rgba(255,255,255,0.22));
  }
  #preview-body {
    padding: 18px 18px 4px 18px;
  }
  #preview-card {
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  }
  .card-label {
    font-weight: 600;
    margin-bottom: 8px;
  }
  #preview-input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 5px;
    border: 1px solid var(--input-border, currentColor);
    background: var(--input-bg);
    font-size: 13px;
    margin-bottom: 12px;
    transition: border-color 0.1s ease, background 0.1s ease;
  }
  #preview-input:hover {
    border-color: var(--input-border-hover, currentColor);
    background: var(--input-bg-hover, var(--input-bg));
  }
  #preview-input:focus {
    border-color: var(--input-border-pressed, currentColor);
    background: var(--input-bg-pressed, var(--input-bg));
    outline: none;
  }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  #tab-strip-row { display: flex; gap: 4px; margin-bottom: 14px; }
  .pv-tab {
    flex: 1;
    border: 1px solid var(--tab-border, transparent);
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: var(--tab-bg);
    color: var(--tab-fg, #fff);
    transition: background 0.1s ease;
  }
  .pv-tab:hover { background: var(--tab-bg-hover, var(--tab-bg)); }
  .pv-tab.active { background: var(--tab-bg-selected); color: var(--tab-fg-selected, #fff); }
  .pv-tab.active:hover { background: var(--tab-bg-selected-hover, var(--tab-bg-selected)); }
  #pill-row-wrap { margin-bottom: 14px; }
  #pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pv-pill {
    display: flex;
    align-items: center;
    padding: 5px 14px;
    border-radius: 6px;
    border: 1.5px solid var(--pill-border);
    background: var(--pill-bg);
    color: var(--pill-fg);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    opacity: var(--pill-opacity, 0.45);
    transition: border-color 0.1s ease, background 0.1s ease, opacity 0.1s ease;
  }
  .pv-pill:hover { opacity: 1; border-color: var(--pill-border-hover, var(--pill-border)); }
  .pv-pill-dot {
    width: 7px; height: 7px;
    border-radius: 4px;
    margin-right: 6px;
    background: var(--pill-dot-bg, rgba(255,255,255,0.25));
  }
  #preview-dropdown-wrap { margin-bottom: 14px; }
  .dd-closed {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1.5px solid var(--dd-border, currentColor);
    background: var(--dd-bg);
    font-size: 12px;
    margin-bottom: 6px;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.1s ease, background 0.1s ease;
  }
  .dd-closed:hover {
    border-color: var(--dd-border-hover, currentColor);
    background: var(--dd-bg-hover, var(--dd-bg));
  }
  .dd-closed:active, .dd-closed.open {
    border-color: var(--dd-border-active, var(--dd-border-hover, currentColor));
    background: var(--dd-bg-active, var(--dd-bg));
  }
  .dd-closed.open #dd-chevron {
    transform: rotate(180deg);
  }
  #dd-chevron {
    transition: transform 0.15s ease;
  }
  .dd-popup {
    border-radius: 6px;
    border: 1px solid;
    padding: 4px;
    display: none;
  }
  .dd-popup.open {
    display: block;
  }
  .dd-item {
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 2px;
    cursor: pointer;
    background: var(--item-bg, transparent);
    transition: background 0.1s ease;
  }
  .dd-item:hover {
    background: var(--item-hover-bg, transparent) !important;
  }
  .dd-item:active {
    filter: brightness(0.9);
  }
  .dd-item.selected {
    background: var(--item-selected-bg, transparent) !important;
    color: var(--item-selected-fg, inherit) !important;
  }
  .pv-btn {
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--btn-fg, #fff);
    transition: background 0.1s ease;
  }
  .pv-btn:hover {
    background: var(--btn-bg-hover, var(--btn-bg));
  }
  .pv-btn:active {
    background: var(--btn-bg-active, var(--btn-bg));
  }
  .pv-btn:disabled {
    background: var(--btn-bg-disabled, var(--btn-bg)) !important;
    color: var(--btn-fg-disabled, var(--btn-fg)) !important;
    cursor: default;
  }
  #toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }
  #accordion-wrap {
    margin-top: 16px;
  }
  .accordion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1.5px solid var(--acc-header-border);
    background: var(--acc-header-bg);
    cursor: pointer;
    user-select: none;
    margin-bottom: 6px;
    transition: border-color 0.1s ease, background 0.1s ease;
  }
  .accordion-header:hover {
    border-color: var(--acc-header-border-hover);
    background: var(--acc-header-bg-hover);
  }
  .accordion-header:active {
    border-color: var(--acc-header-border-active);
    background: var(--acc-header-bg-active);
  }
  .accordion-header.open {
    border-color: var(--acc-header-border-hover);
  }
  #accordion-chevron {
    transition: transform 0.15s ease;
  }
  .accordion-header.open #accordion-chevron {
    transform: rotate(180deg);
  }
  .accordion-body {
    border-radius: 6px;
    border: 1px solid var(--acc-body-border);
    background: var(--acc-body-bg);
    padding: 8px;
    display: none;
  }
  .accordion-body.open { display: block; }
  .accordion-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px;
    font-size: 12px;
    border-radius: 4px;
    transition: background 0.1s ease;
  }
  .accordion-row:hover {
    background: var(--acc-row-hover-bg);
  }
  .mini-toggle {
    position: relative;
    width: 32px;
    height: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: filter 0.1s ease;
  }
  .mini-toggle:hover {
    filter: brightness(1.12);
  }
  .mini-toggle:active {
    filter: brightness(0.9);
  }
  .mini-toggle-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 6px;
    background: #fff;
    transition: left 0.15s ease;
  }
  .mini-toggle-on .mini-toggle-knob { left: 18px; }
  .toggle-track {
    position: relative;
    cursor: pointer;
    background: var(--track-bg);
    transition: background 0.15s ease;
  }
  .toggle-track:hover {
    background: var(--track-bg-hover, var(--track-bg));
  }
  .toggle-track:active {
    background: var(--track-bg-active, var(--track-bg));
  }
  .toggle-knob {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    transition: left 0.15s ease;
  }
  #toggle-label {
    font-size: 11px;
  }
  footer {
    padding: 20px 28px;
    border-top: 1px solid var(--editor-border);
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }
  .footer-group {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px 8px 12px;
    background: var(--editor-panel);
    border: 1px solid var(--editor-border);
    border-radius: 8px;
  }
  .footer-group-label {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--editor-muted);
    margin-right: 4px;
  }
  .action-btn {
    background: var(--editor-accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.1s ease;
  }
  .action-btn:hover {
    background: var(--editor-accent-hover);
  }
  .action-btn:active {

  blue:   { label: "Blue",   bg: "#3584e4" },
  teal:   { label: "Teal",   bg: "#2190a4" },

  purple: { label: "Purple", bg: "#9141ac" },
  slate:  { label: "Slate",  bg: "#6f8396" },
};

function hexShade(hex, percent) {
  // percent > 0 lightens toward white, < 0 darkens toward black
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 0xff, g = (num >> 8) & 0xff, b = num & 0xff;
  const t = percent < 0 ? 0 : 255;
  const p = Math.abs(percent);
  r = Math.round(r + (t - r) * p);
  g = Math.round(g + (t - g) * p);
  b = Math.round(b + (t - b) * p);
  return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase();
}

function applyAccent(accentKey) {
  const preset = GNOME_ACCENTS[accentKey];

  DATA[activeColorProfile].border_pressed = hexShade(preset.bg, 0.27);
  DATA[activeColorProfile].border_muted = preset.bg;

function getDim(path) {
  const [a, b] = path.split(".");
  return DIMENSIONS[a][b];
}
function setDim(path, value) {
  const [a, b] = path.split(".");
  DIMENSIONS[a][b] = value;
}

function groupedKeys() {
  const groups = {};
  KEY_META.forEach(([key, label, group]) => {
    if (!groups[group]) groups[group] = [];
    groups[group].push([key, label]);
  });
  return groups;
}

function groupedDims() {
  const groups = {};
  DIM_META.forEach(([path, label, group]) => {
    if (!groups[group]) groups[group] = [];
    groups[group].push([path, label]);
  });
  return groups;
}

let iconSearchTerm = "";

function renderIconsEditor() {
  const col = document.getElementById("editor-col");
  col.innerHTML = "";

  const toolbar = document.createElement("div");
  toolbar.innerHTML = `
    <input type="text" id="icon-search" placeholder="Search icons by name or description...">
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap;">
      <button class="action-btn" id="icon-add-btn" style="padding:8px 14px;font-size:12px;">+ Add Icon</button>
    </div>
  `;
  col.appendChild(toolbar);

  const list = document.createElement("div");
  list.id = "icon-list";
  col.appendChild(list);

  document.getElementById("icon-search").value = iconSearchTerm;
  document.getElementById("icon-search").addEventListener("input", (e) => {
    iconSearchTerm = e.target.value;
    renderIconList();
  });
  document.getElementById("icon-add-btn").addEventListener("click", addNewIcon);

  renderIconList();
}

function renderIconList() {
  const list = document.getElementById("icon-list");
  if (!list) return;
  list.innerHTML = "";

  const term = iconSearchTerm.trim().toLowerCase();
  const keys = Object.keys(ICON_DATA).sort().filter(key => {
    if (!term) return true;
    return key.toLowerCase().includes(term) || (ICON_DATA[key].description || "").toLowerCase().includes(term);
  });

  keys.forEach(key => {
    list.appendChild(buildIconRow(key));
  });

  if (keys.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "color: var(--editor-muted); font-size: 12px; padding: 20px; text-align: center;";
    empty.textContent = "No icons match that search.";
    list.appendChild(empty);
  }
}

function buildIconRow(key) {
  const icon = ICON_DATA[key];
  const row = document.createElement("div");
  row.className = "icon-row";
  row.dataset.token = key;

  const preview = document.createElement("div");
  preview.className = "icon-preview";
  preview.innerHTML = `<svg viewBox="0 0 24 24"><path d="${icon.path}" fill="${DATA[activeColorProfile].text_primary}"/></svg>`;

  const fields = document.createElement("div");
  fields.className = "icon-fields";

  const fieldsRow = document.createElement("div");
  fieldsRow.className = "icon-fields-row";

  const keyInput = document.createElement("input");
  keyInput.className = "icon-key-input";
  keyInput.value = key;
  keyInput.title = "Icon key (used in make_icon('key', ...))";
  keyInput.addEventListener("change", (e) => {
    const newKey = e.target.value.trim();
    if (!newKey || newKey === key || ICON_DATA[newKey]) {
      e.target.value = key;
      return;
    }
    ICON_DATA[newKey] = ICON_DATA[key];
    delete ICON_DATA[key];
    renderIconList();
  });

  const descInput = document.createElement("input");
  descInput.className = "icon-desc-input";
  descInput.value = icon.description || "";
  descInput.placeholder = "Description";
  descInput.addEventListener("change", (e) => {
    ICON_DATA[key].description = e.target.value;
  });

  fieldsRow.appendChild(keyInput);
  fieldsRow.appendChild(descInput);

  const pathInput = document.createElement("textarea");
  pathInput.className = "icon-path-input";
  pathInput.value = icon.path;
  pathInput.rows = 1;
  pathInput.addEventListener("change", (e) => {
    ICON_DATA[key].path = e.target.value.trim();
    preview.innerHTML = `<svg viewBox="0 0 24 24"><path d="${ICON_DATA[key].path}" fill="${DATA[activeColorProfile].text_primary}"/></svg>`;
  });

  fields.appendChild(fieldsRow);
  fields.appendChild(pathInput);

  const deleteBtn = document.createElement("button");
  deleteBtn.className = "icon-delete-btn";
  deleteBtn.innerHTML = "&#10005;";
  deleteBtn.title = "Delete icon";
  deleteBtn.addEventListener("click", () => {
    delete ICON_DATA[key];
    renderIconList();
  });

  row.appendChild(preview);
  row.appendChild(fields);
  row.appendChild(deleteBtn);
  return row;
}

function addNewIcon() {
  let base = "new_icon";
  let n = 1;
  let key = base;
  while (ICON_DATA[key]) {
    key = base + "_" + n;
    n++;
  }
  ICON_DATA[key] = { description: "New Icon", path: "M4,4L20,4L20,20L4,20Z" };
  iconSearchTerm = "";
  renderIconsEditor();
}

function buildIconsExportObject() {
  // Matches the real _icons.json schema exactly (key -> path string) so
  // it drops straight into Snippets/_icons.py's loader unchanged.
  // Descriptions are an editing aid in this tool only, not exported -
  // same pattern as the colour/size labels, which also aren't exported.
  const out = {};
  Object.keys(ICON_DATA).sort().forEach(key => {
    out[key] = ICON_DATA[key].path;
  });
  return out;
}

function exportIconsJSON() {
  const out = document.getElementById("json-out");
  const text = JSON.stringify(buildIconsExportObject(), null, 2);
  out.style.display = out.style.display === "none" ? "block" : "none";
  out.textContent = text;
}

function downloadIconsJSON() {
  const text = JSON.stringify(buildIconsExportObject(), null, 2);
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "_icons.json";
  a.click();
  URL.revokeObjectURL(url);
}

function renderSizingEditor() {
  const col = document.getElementById("editor-col");
  col.innerHTML = "";
  const groups = groupedDims();
  Object.keys(groups).forEach(groupName => {
    const groupDiv = document.createElement("div");
    groupDiv.className = "group";
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = groupName;
    groupDiv.appendChild(title);

    groups[groupName].forEach(([path, label]) => {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.token = path;

      const labelWrap = document.createElement("label");
      labelWrap.innerHTML = label + '<span class="key-name">' + path + '</span>';

      const numInput = document.createElement("input");
      numInput.className = "num-input";
      numInput.type = "number";
      numInput.value = getDim(path);
      numInput.min = 0;
      numInput.addEventListener("change", (e) => {
        const v = parseFloat(e.target.value);
        if (!isNaN(v)) {
          setDim(path, v);
          renderPreview();
        }
      });

      const unit = document.createElement("span");
      unit.className = "num-unit";
      unit.textContent = "px";

      row.appendChild(labelWrap);
      row.appendChild(numInput);
      row.appendChild(unit);
      groupDiv.appendChild(row);
    });
    col.appendChild(groupDiv);
  });
}

function renderActiveTab() {
  if (activeTab === "sizing") {
    renderSizingEditor();
  } else if (activeTab === "icons") {
    renderIconsEditor();
  } else {
    renderEditor();
  }
  applyTokenHighlights();
}

function renderEditor() {
  const col = document.getElementById("editor-col");
  col.innerHTML = "";
  const groups = groupedKeys();
  Object.keys(groups).forEach(groupName => {
    const groupDiv = document.createElement("div");
    groupDiv.className = "group";
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = groupName;
    groupDiv.appendChild(title);

    if (groupName === "Accent") {
      const pickerRow = document.createElement("div");
      pickerRow.className = "row";
      const pickerLabel = document.createElement("label");
      pickerLabel.innerHTML = "Apply accent colour<span class=\"key-name\">sets accent + hover/pressed/border</span>";
      const pickerSelect = document.createElement("select");
      pickerSelect.className = "hex-input";
      pickerSelect.style.width = "170px";
      pickerSelect.innerHTML = '<option value="">-- choose --</option>' +
        Object.keys(GNOME_ACCENTS).map(k => `<option value="${k}">${GNOME_ACCENTS[k].label}</option>`).join("");
      pickerSelect.addEventListener("change", (e) => {
        if (e.target.value) applyAccent(e.target.value);
      });
      pickerRow.appendChild(pickerLabel);
      pickerRow.appendChild(pickerSelect);
      groupDiv.appendChild(pickerRow);
    }

    groups[groupName].forEach(([key, label]) => {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.token = key;

      const swatchWrap = document.createElement("div");
      swatchWrap.className = "swatch-wrap";
      swatchWrap.style.background = DATA[activeColorProfile][key];
      const colorInput = document.createElement("input");
      colorInput.type = "color";
      colorInput.value = DATA[activeColorProfile][key];
      colorInput.addEventListener("input", (e) => {
        updateColor(key, e.target.value);
      });
      swatchWrap.appendChild(colorInput);

      const labelWrap = document.createElement("label");
      labelWrap.innerHTML = label + '<span class="key-name">' + key + '</span>';

      const hexInput = document.createElement("input");
      hexInput.className = "hex-input";
      hexInput.value = DATA[activeColorProfile][key];
      hexInput.maxLength = 7;
      hexInput.addEventListener("change", (e) => {
        let v = e.target.value.trim();
        if (!v.startsWith("#")) v = "#" + v;
        if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
          updateColor(key, v);
        } else {
          e.target.value = DATA[activeColorProfile][key];
        }
      });

      const resetBtn = document.createElement("button");
      resetBtn.className = "reset-btn";
      resetBtn.type = "button";
      resetBtn.innerHTML = "&#8635;";
      resetBtn.title = "Reset to default (" + DEFAULTS[activeColorProfile][key] + ")";
      const isDefault = DATA[activeColorProfile][key].toLowerCase() === DEFAULTS[activeColorProfile][key].toLowerCase();
      resetBtn.disabled = isDefault;
      resetBtn.addEventListener("click", () => {
        updateColor(key, DEFAULTS[activeColorProfile][key]);
      });

      row.appendChild(swatchWrap);
      row.appendChild(labelWrap);
      row.appendChild(hexInput);
      row.appendChild(resetBtn);
      groupDiv.appendChild(row);
    });
    col.appendChild(groupDiv);
  });
}

function updateColor(key, value) {
  DATA[activeColorProfile][key] = value;
  renderEditor();
  renderPreview();
}

function applyEditorChrome() {
  const c = DATA[activeColorProfile];
  const root = document.documentElement.style;
  root.setProperty("--editor-accent", c.accent);
  root.setProperty("--editor-accent-hover", c.accent_hover);
  root.setProperty("--editor-accent-pressed", c.accent_pressed);
}

  const menuPopup = document.getElementById("topbar-menu-popup");
  menuPopup.style.background = c.card_bg;
  menuPopup.style.borderColor = c.border_default;

  win.style.borderRadius = d.top_bar.corner_radius + "px";
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = btn.dataset.profile;
    if (activeTab !== "sizing" && activeTab !== "icons") activeColorProfile = activeTab;
    renderActiveTab();
    renderPreview();
  });
});

document.getElementById("reset-all-btn").addEventListener("click", () => {
  if (activeTab === "sizing" || activeTab === "icons") return;
  DATA[activeColorProfile] = JSON.parse(JSON.stringify(DEFAULTS[activeColorProfile]));
  renderActiveTab();
  renderPreview();
});

function buildExportObject() {
  return {
    active_profile: activeColorProfile,
    dimensions: DIMENSIONS,
    profiles: {
      dark: DATA.dark,
      light: DATA.light
    }
  };
}

// Maps every semantic key this editor manages to the exact WPF resource

  "input_textbox.height": "HeightInput", "input_textbox.corner_radius": "CornerRadiusInput", "input_textbox.border_thickness": "BorderThicknessInput", "input_textbox.font_size": "FontSizeInput",

};
function br(key) { return "{DynamicResource " + BRUSH_NAME[key] + "}"; }
function dm(path) { return "{DynamicResource " + DIM_NAME[path] + "}"; }

function buildXamlStyles() {
  // Every value below is a DynamicResource reference back to the names in
  // BRUSH_NAME/DIM_NAME above, never a literal hex or pixel number - that's
  // the whole point of this file existing separately from the palette/
  // sizing JSON. Re-export this only when a control's actual structure
  // changes (new hover trigger, different template shape); ordinary colour
  // or size tweaks keep working through the JSON alone once this is merged
  // into a window at runtime.
  return `<!--
===================================================================================
Seed43Styles.xaml - GENERATED by the Seed43 Palette Editor. Do not hand-edit;
re-export from the editor instead so this file and the editor never drift.
===================================================================================
Every value here is a DynamicResource reference to a resource key that
seed43_theme.py's apply_seed43_palette()/apply_seed43_dimensions() injects
at runtime from seed43_palette.json - nothing in this file is a literal
colour or pixel number. Ordinary palette edits (new accent colour, a
different corner radius) only require re-exporting seed43_palette.json,
not this file - only structural changes to a control (a different hover
trigger, a reshaped template) need this file re-exported and re-merged.
-->
<ResourceDictionary xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
                     xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">

    <!-- ============================================================ -->
    <!-- BUTTONS                                                       -->
    <!-- ============================================================ -->

    <Style x:Key="PrimaryButtonStyle" TargetType="Button">
        <Setter Property="Background"      Value="${br('accent')}"/>
        <Setter Property="Foreground"      Value="#FFFFFF"/>
        <Setter Property="BorderThickness" Value="0"/>
        <Setter Property="Padding"         Value="{DynamicResource PaddingButtonPrimary}"/>
        <Setter Property="FontSize"        Value="${dm('button_primary.font_size')}"/>
        <Setter Property="FontWeight"      Value="SemiBold"/>
        <Setter Property="Cursor"          Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Button">
                    <Border x:Name="bd" Background="{TemplateBinding Background}"
                            CornerRadius="${dm('button_primary.corner_radius')}"
                            Padding="{TemplateBinding Padding}">
                        <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('accent_hover')}"/>
                        </Trigger>
                        <Trigger Property="IsPressed" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('accent_pressed')}"/>
                        </Trigger>
                        <Trigger Property="IsEnabled" Value="False">
                            <Setter TargetName="bd" Property="Background" Value="${br('secondary_disabled_bg')}"/>
                            <Setter Property="Foreground" Value="${br('secondary_disabled_fg')}"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <Style x:Key="SecondaryButtonStyle" TargetType="Button">
        <Setter Property="Background"      Value="${br('secondary_bg')}"/>
        <Setter Property="Foreground"      Value="${br('text_primary')}"/>
        <Setter Property="BorderThickness" Value="0"/>
        <Setter Property="Padding"         Value="{DynamicResource PaddingButtonSecondary}"/>
        <Setter Property="FontSize"        Value="${dm('button_secondary.font_size')}"/>
        <Setter Property="Cursor"          Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Button">
                    <Border x:Name="bd" Background="{TemplateBinding Background}"
                            CornerRadius="${dm('button_secondary.corner_radius')}"
                            Padding="{TemplateBinding Padding}">
                        <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('secondary_hover')}"/>
                        </Trigger>
                        <Trigger Property="IsPressed" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('secondary_pressed')}"/>
                        </Trigger>
                        <Trigger Property="IsEnabled" Value="False">
                            <Setter TargetName="bd" Property="Background" Value="${br('secondary_disabled_bg')}"/>
                            <Setter Property="Foreground" Value="${br('secondary_disabled_fg')}"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <!-- Tab button - the standard size for tab strips throughout the
         extension (Settings/Blocks/Options-style tab rows). Active vs
         inactive is handled by swapping Background between Accent and
         SecondaryBg via code, not a separate style - the shape is shared. -->
    <Style x:Key="TabButtonStyle" TargetType="Button">
        <Setter Property="Foreground"      Value="#FFFFFF"/>
        <Setter Property="BorderThickness" Value="0"/>
        <Setter Property="Height"          Value="${dm('button_small.height')}"/>
        <Setter Property="FontSize"        Value="${dm('button_small.font_size')}"/>
        <Setter Property="Cursor"          Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Button">
                    <Border x:Name="bd" Background="{TemplateBinding Background}"
                            CornerRadius="${dm('button_small.corner_radius')}"
                            Padding="{TemplateBinding Padding}">
                        <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="bd" Property="Opacity" Value="0.85"/>
                        </Trigger>
                        <Trigger Property="IsPressed" Value="True">
                            <Setter TargetName="bd" Property="Opacity" Value="0.7"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <!-- Small icon button - a tiny square icon-only button (stepper
         +/- controls, an inline gear/settings icon sitting beside a
         textbox or combobox in the same toolbar row). Height matches
         TextBoxStyle's own height token deliberately, so it lines up
         cleanly with whatever input control it's sitting next to. -->
    <Style x:Key="SmallIconButtonStyle" TargetType="Button">
        <Setter Property="Background"      Value="Transparent"/>
        <Setter Property="Foreground"      Value="${br('text_primary')}"/>
        <Setter Property="BorderThickness" Value="0"/>
        <Setter Property="Width"           Value="${dm('input_textbox.height')}"/>
        <Setter Property="Height"          Value="${dm('input_textbox.height')}"/>
        <Setter Property="Cursor"          Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Button">
                    <Border x:Name="bd" Background="{TemplateBinding Background}"
                            CornerRadius="${dm('input_textbox.corner_radius')}">
                        <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('secondary_bg')}"/>
                        </Trigger>
                        <Trigger Property="IsPressed" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('secondary_hover')}"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <!-- Icon button - transparent until hover, for a subtle utility
         action sitting inline (gear/settings icon, hamburger menu, etc). -->
    <Style x:Key="IconButtonStyle" TargetType="Button">
        <Setter Property="Background"      Value="Transparent"/>
        <Setter Property="Foreground"      Value="${br('text_primary')}"/>
        <Setter Property="BorderThickness" Value="0"/>
        <Setter Property="Width"           Value="${dm('button_menu.width')}"/>
        <Setter Property="Height"          Value="${dm('button_menu.height')}"/>
        <Setter Property="Cursor"          Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Button">
                    <Border x:Name="bd" Background="{TemplateBinding Background}"
                            CornerRadius="${dm('button_menu.corner_radius')}">
                        <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('dropdown_item_hover')}"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <!-- Icon toggle button - same size/shape as IconButtonStyle, but for a
         ToggleButton with a persistent open/checked state (the hamburger
         menu button, primarily) rather than a one-shot action. Matches
         pyTransmit's real LocalHamburgerToggle: transparent idle, secondary_bg
         on hover, full accent fill while IsChecked="True" (i.e. while its
         menu/panel is open) - distinct from IconButtonStyle's hover colour,
         which uses dropdown_item_hover instead. -->
    <Style x:Key="IconToggleButtonStyle" TargetType="ToggleButton">
        <Setter Property="Background"      Value="Transparent"/>
        <Setter Property="BorderThickness" Value="0"/>
        <Setter Property="Width"           Value="${dm('button_menu.width')}"/>
        <Setter Property="Height"          Value="${dm('button_menu.height')}"/>
        <Setter Property="Cursor"          Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="ToggleButton">
                    <Border x:Name="bd" Background="Transparent"
                            CornerRadius="${dm('button_menu.corner_radius')}"
                            Width="{TemplateBinding Width}" Height="{TemplateBinding Height}">
                        <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('secondary_bg')}"/>
                        </Trigger>
                        <Trigger Property="IsChecked" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('accent')}"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <!-- ============================================================ -->
    <!-- MENU - the dropdown that opens from IconToggleButtonStyle.    -->
    <!-- Open/close is NOT part of this Style - it's handled entirely  -->
    <!-- in code-behind, matching pyTransmit's real pattern exactly:   -->
    <!--   1) The button's Click handler is genuinely just "closed ->  -->
    <!--      open it, open -> close it". Nothing fancier.             -->
    <!--   2) The Popup itself MUST have StaysOpen="True". Without it, -->
    <!--      WPF's own auto-dismiss fires and races against the click -->
    <!--      handler above - clicking the button to close an open     -->
    <!--      menu triggers BOTH the Popup's own dismiss AND the click -->
    <!--      handler, which then reopens what the dismiss just        -->
    <!--      closed. StaysOpen="True" removes that race entirely.     -->
    <!--   3) With auto-dismiss disabled, closing on an outside click  -->
    <!--      has to be handled explicitly instead: wire the window's  -->
    <!--      own PreviewMouseDown, and in that handler, walk up the   -->
    <!--      visual tree from args.OriginalSource - if it's inside    -->
    <!--      the toggle button OR inside the popup's own content,     -->
    <!--      do nothing (the click handler above already deals with   -->
    <!--      the button, and a click inside the popup shouldn't close -->
    <!--      it out from under itself). Otherwise, close the popup.   -->
    <!--   Skipping the exclusion in (3) reintroduces the same double- -->
    <!--   toggle bug (2) exists to prevent, just from the other side. -->
    <!-- ============================================================ -->

    <Style x:Key="MenuItemStyle" TargetType="Button">
        <Setter Property="Background"                 Value="Transparent"/>
        <Setter Property="Foreground"                 Value="${br('text_primary')}"/>
        <Setter Property="BorderThickness"            Value="0"/>
        <Setter Property="Padding"                    Value="${dm('menu_item.padding_x')},${dm('menu_item.padding_y')}"/>
        <Setter Property="FontSize"                   Value="${dm('menu_item.font_size')}"/>
        <Setter Property="HorizontalAlignment"        Value="Stretch"/>
        <Setter Property="HorizontalContentAlignment" Value="Left"/>
        <Setter Property="Cursor"                     Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Button">
                    <Border x:Name="bd" Background="{TemplateBinding Background}"
                            Padding="{TemplateBinding Padding}">
                        <ContentPresenter HorizontalAlignment="{TemplateBinding HorizontalContentAlignment}"
                                          VerticalAlignment="Center"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('accent')}"/>
                        </Trigger>
                        <Trigger Property="IsPressed" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('accent_pressed')}"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>         this window/card") and looks permanently red, not just on hover. -->
    <Style x:Key="CloseButtonStyle" TargetType="Button">
        <Setter Property="Background"      Value="Transparent"/>
        <Setter Property="Foreground"      Value="${br('text_primary')}"/>
        <Setter Property="BorderThickness" Value="0"/>
        <Setter Property="Width"           Value="${dm('button_close.width')}"/>
        <Setter Property="Height"          Value="${dm('button_close.height')}"/>
        <Setter Property="Cursor"          Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Button">
                    <Border x:Name="bd" Background="{TemplateBinding Background}"
                            CornerRadius="${dm('button_close.corner_radius')}">
                        <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="bd" Property="Background" Value="${br('danger')}"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <!-- Delete button - permanently danger-red (not transparent-until-
         hover), for "delete this item" actions, e.g. removing a custom
         text style or a saved template. Opacity-dims on hover instead of
         changing colour, since it's already showing its "final" colour. -->
    <Style x:Key="DeleteButtonStyle" TargetType="Button">
        <Setter Property="Background"      Value="${br('danger')}"/>
        <Setter Property="Foreground"      Value="#FFFFFF"/>
        <Setter Property="BorderThickness" Value="0"/>
        <Setter Property="Width"           Value="${dm('button_close.width')}"/>
        <Setter Property="Height"          Value="${dm('button_close.height')}"/>
        <Setter Property="Cursor"          Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Button">
                    <Border x:Name="bd" Background="{TemplateBinding Background}"
                            CornerRadius="${dm('button_close.corner_radius')}">
                        <ContentPresenter HorizontalAlignment="Center" VerticalAlignment="Center"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="bd" Property="Opacity" Value="0.8"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <!-- ============================================================ -->
    <!-- INPUTS                                                        -->
    <!-- ============================================================ -->

    <Style x:Key="TextBoxStyle" TargetType="TextBox">
        <Setter Property="Background"               Value="${br('input_bg')}"/>
        <Setter Property="Foreground"                Value="${br('text_input')}"/>
        <Setter Property="BorderBrush"               Value="${br('border_default')}"/>
        <Setter Property="BorderThickness"           Value="${dm('input_textbox.border_thickness')}"/>
        <Setter Property="FontSize"                  Value="${dm('input_textbox.font_size')}"/>
        <Setter Property="Height"                    Value="${dm('input_textbox.height')}"/>
        <Setter Property="VerticalContentAlignment"  Value="Center"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="TextBox">
                    <Border x:Name="Bd" Background="{TemplateBinding Background}"
                            BorderBrush="{TemplateBinding BorderBrush}"
                            BorderThickness="{TemplateBinding BorderThickness}"
                            CornerRadius="${dm('input_textbox.corner_radius')}">
                        <!-- No Margin="{TemplateBinding Padding}" here - WPF
                             auto-applies TextBox.Padding to whatever is named
                             PART_ContentHost, doing it again here double-
                             applies it and clips/garbles the visible text. -->
                        <ScrollViewer x:Name="PART_ContentHost"
                                      Focusable="False"
                                      HorizontalScrollBarVisibility="Hidden"
                                      VerticalScrollBarVisibility="Hidden"/>
                    </Border>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="Bd" Property="BorderBrush" Value="${br('border_hover')}"/>
                            <Setter TargetName="Bd" Property="Background" Value="${br('input_bg_hover')}"/>
                        </Trigger>
                        <Trigger Property="IsFocused" Value="True">
                            <Setter TargetName="Bd" Property="BorderBrush" Value="${br('border_pressed')}"/>
                            <Setter TargetName="Bd" Property="Background" Value="${br('input_bg_pressed')}"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <Style x:Key="ComboBoxStyle" TargetType="ComboBox">
        <Setter Property="Background"      Value="${br('input_bg')}"/>
        <Setter Property="Foreground"      Value="${br('text_input')}"/>
        <Setter Property="BorderBrush"     Value="${br('border_default')}"/>
        <Setter Property="BorderThickness" Value="1"/>
        <Setter Property="FontSize"        Value="${dm('input_combobox.font_size')}"/>
        <Setter Property="Height"          Value="${dm('input_combobox.height')}"/>
        <Setter Property="ItemContainerStyle">
            <Setter.Value>
                <Style TargetType="ComboBoxItem">
                    <Setter Property="Background" Value="${br('card_bg')}"/>
                    <Setter Property="Foreground" Value="${br('text_primary')}"/>
                    <Setter Property="Template">
                        <Setter.Value>
                            <ControlTemplate TargetType="ComboBoxItem">
                                <Border x:Name="Bd" Background="{TemplateBinding Background}"
                                        CornerRadius="${dm('dropdown_popup.item_corner_radius')}"
                                        Padding="{TemplateBinding Padding}">
                                    <ContentPresenter/>
                                </Border>
                                <ControlTemplate.Triggers>
                                    <Trigger Property="IsHighlighted" Value="True">
                                        <Setter TargetName="Bd" Property="Background" Value="${br('dropdown_item_hover')}"/>
                                    </Trigger>
                                    <Trigger Property="IsSelected" Value="True">
                                        <Setter TargetName="Bd" Property="Background" Value="${br('accent')}"/>
                                    </Trigger>
                                </ControlTemplate.Triggers>
                            </ControlTemplate>
                        </Setter.Value>
                    </Setter>
                </Style>
            </Setter.Value>
        </Setter>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="ComboBox">
                    <Grid>
                        <ToggleButton x:Name="ToggleButton"
                                      Background="{TemplateBinding Background}"
                                      BorderBrush="{TemplateBinding BorderBrush}"
                                      BorderThickness="{TemplateBinding BorderThickness}"
                                      IsChecked="{Binding Path=IsDropDownOpen, Mode=TwoWay, RelativeSource={RelativeSource TemplatedParent}}"
                                      Focusable="False" ClickMode="Press">
                            <ToggleButton.Template>
                                <ControlTemplate TargetType="ToggleButton">
                                    <Border x:Name="tgBd" Background="{TemplateBinding Background}"
                                            BorderBrush="{TemplateBinding BorderBrush}"
                                            BorderThickness="{TemplateBinding BorderThickness}"
                                            CornerRadius="${dm('input_combobox.corner_radius')}">
                                        <Grid>
                                            <Grid.ColumnDefinitions>
                                                <ColumnDefinition Width="*"/>
                                                <ColumnDefinition Width="18"/>
                                            </Grid.ColumnDefinitions>
                                            <ContentPresenter Grid.Column="0" Margin="8,0,0,0"
                                                              VerticalAlignment="Center" HorizontalAlignment="Left"/>
                                            <TextBlock Grid.Column="1" Text="&#9662;" FontSize="9"
                                                       Foreground="${br('text_input')}"
                                                       HorizontalAlignment="Center" VerticalAlignment="Center"/>
                                        </Grid>
                                    </Border>
                                    <ControlTemplate.Triggers>
                                        <Trigger Property="IsMouseOver" Value="True">
                                            <Setter TargetName="tgBd" Property="BorderBrush" Value="${br('border_hover')}"/>
                                        </Trigger>
                                    </ControlTemplate.Triggers>
                                </ControlTemplate>
                            </ToggleButton.Template>
                        </ToggleButton>
                        <ContentPresenter x:Name="ContentSite" IsHitTestVisible="False"
                                          Content="{TemplateBinding SelectionBoxItem}"
                                          ContentTemplate="{TemplateBinding SelectionBoxItemTemplate}"
                                          Margin="8,0,22,0" VerticalAlignment="Center" HorizontalAlignment="Left"/>
                        <Popup x:Name="Popup" Placement="Bottom"
                               IsOpen="{TemplateBinding IsDropDownOpen}"
                               AllowsTransparency="True" Focusable="False" PopupAnimation="Slide">
                            <Border x:Name="DropDownBorder"
                                    MinWidth="{TemplateBinding ActualWidth}"
                                    MaxHeight="{TemplateBinding MaxDropDownHeight}"
                                    Background="${br('card_bg')}"
                                    BorderBrush="${br('border_muted')}"
                                    CornerRadius="${dm('dropdown_popup.corner_radius')}"
                                    BorderThickness="1">
                                <Border.Effect>
                                    <DropShadowEffect Color="Black" Opacity="0.4" ShadowDepth="3" BlurRadius="8"/>
                                </Border.Effect>
                                <ScrollViewer Style="{DynamicResource MacScrollViewer}" CanContentScroll="True" VerticalScrollBarVisibility="Auto">
                                    <StackPanel IsItemsHost="True" KeyboardNavigation.DirectionalNavigation="Contained"/>
                                </ScrollViewer>
                            </Border>
                        </Popup>
                    </Grid>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <!-- ============================================================ -->
    <!-- CARD / LABELS                                                 -->
    <!-- ============================================================ -->

    <Style x:Key="CardStyle" TargetType="Border">
        <Setter Property="Background"    Value="${br('card_bg')}"/>
        <Setter Property="BorderBrush"   Value="${br('border_muted')}"/>
        <Setter Property="BorderThickness" Value="1"/>
        <Setter Property="CornerRadius"  Value="${dm('card.corner_radius')}"/>
        <Setter Property="Padding"       Value="${dm('card.padding')}"/>
    </Style>

    <Style x:Key="SectionLabelStyle" TargetType="TextBlock">
        <Setter Property="Foreground"  Value="${br('accent')}"/>
        <Setter Property="FontWeight"  Value="SemiBold"/>
        <Setter Property="FontSize"    Value="${dm('text.section_label')}"/>
        <Setter Property="Margin"      Value="0,0,0,8"/>
    </Style>

    <Style x:Key="FieldLabelStyle" TargetType="TextBlock">
        <Setter Property="Foreground"  Value="${br('text_primary')}"/>
        <Setter Property="FontWeight"  Value="Medium"/>
        <Setter Property="FontSize"    Value="${dm('text.field_label')}"/>
        <Setter Property="Margin"      Value="0,0,0,4"/>
        <Setter Property="Opacity"     Value="0.9"/>
    </Style>

    <!-- ============================================================ -->
    <!-- FORMAT PILL - three states driven by the button's Tag, not a  -->
    <!-- separate IsChecked/IsSelected property: Tag="" = off (dim),   -->
    <!-- Tag="Enabled" = included in export but not the open settings  -->
    <!-- panel, Tag="Viewing" = the currently open settings panel.     -->
    <!-- Set el.Tag from code when the underlying state changes, same  -->
    <!-- way pySheets' own exp_subtab_clicked handler does it.         -->
    <!-- ============================================================ -->

    <Style x:Key="PillButtonStyle" TargetType="Button">
        <Setter Property="Background"      Value="${br('pill_off_bg')}"/>
        <Setter Property="Foreground"      Value="${br('text_primary')}"/>
        <Setter Property="BorderBrush"     Value="${br('pill_off_border')}"/>
        <Setter Property="BorderThickness" Value="1.5"/>
        <Setter Property="FontSize"        Value="${dm('button_small.font_size')}"/>
        <Setter Property="FontWeight"      Value="Bold"/>
        <Setter Property="Opacity"         Value="0.45"/>
        <Setter Property="Padding"         Value="14,5"/>
        <Setter Property="Cursor"          Value="Hand"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Button">
                    <Border x:Name="Bd" Background="{TemplateBinding Background}"
                            BorderBrush="{TemplateBinding BorderBrush}"
                            BorderThickness="{TemplateBinding BorderThickness}"
                            CornerRadius="${dm('button_small.corner_radius')}"
                            Padding="{TemplateBinding Padding}">
                        <StackPanel Orientation="Horizontal" VerticalAlignment="Center">
                            <Ellipse x:Name="Dot" Width="7" Height="7"
                                     Fill="White" Opacity="0.25"
                                     Margin="0,0,6,0" VerticalAlignment="Center"/>
                            <ContentPresenter VerticalAlignment="Center"/>
                        </StackPanel>
                    </Border>
                    <ControlTemplate.Triggers>
                        <!-- Hover on the off state only - already-active
                             states don't need a hover cue, they're already
                             at full opacity. -->
                        <MultiTrigger>
                            <MultiTrigger.Conditions>
                                <Condition Property="IsMouseOver" Value="True"/>
                                <Condition Property="Tag" Value=""/>
                            </MultiTrigger.Conditions>
                            <Setter TargetName="Bd" Property="BorderBrush" Value="${br('accent')}"/>
                            <Setter Property="Opacity" Value="1"/>
                        </MultiTrigger>
                        <!-- Enabled: included in export, but not the open
                             settings panel right now - bg stays the muted
                             "off" colour, only the border+dot go green. -->
                        <Trigger Property="Tag" Value="Enabled">
                            <Setter TargetName="Bd" Property="BorderBrush" Value="${br('accent')}"/>
                            <Setter TargetName="Dot" Property="Fill" Value="${br('accent')}"/>
                            <Setter TargetName="Dot" Property="Opacity" Value="1"/>
                            <Setter Property="Opacity" Value="1"/>
                        </Trigger>
                        <!-- Viewing: this format's settings panel is the one
                             currently open - full accent fill, white dot. -->
                        <Trigger Property="Tag" Value="Viewing">
                            <Setter TargetName="Bd" Property="Background" Value="${br('accent')}"/>
                            <Setter TargetName="Bd" Property="BorderBrush" Value="${br('accent')}"/>
                            <Setter TargetName="Dot" Property="Fill" Value="White"/>
                            <Setter TargetName="Dot" Property="Opacity" Value="1"/>
                            <Setter Property="Opacity" Value="1"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <!-- ============================================================ -->
    <!-- SCROLLBAR - no dedicated size tokens yet, matches the 8/10px  -->
    <!-- every window in the extension already uses identically.       -->
    <!-- ============================================================ -->

    <Style x:Key="MacScrollBarThumb" TargetType="Thumb">
        <Setter Property="Background" Value="${br('accent')}"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="Thumb">
                    <Border x:Name="thumb" Background="{TemplateBinding Background}"
                            CornerRadius="3" Margin="2,2,2,2"/>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="thumb" Property="Background" Value="${br('accent_hover')}"/>
                        </Trigger>
                        <Trigger Property="IsDragging" Value="True">
                            <Setter TargetName="thumb" Property="Background" Value="${br('accent_hover')}"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <Style x:Key="MacScrollBar" TargetType="ScrollBar">
        <Setter Property="Orientation" Value="Vertical"/>
        <Setter Property="Width"       Value="8"/>
        <Setter Property="MinWidth"    Value="8"/>
        <Setter Property="Background"  Value="Transparent"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="ScrollBar">
                    <Grid x:Name="GridRoot" Width="8">
                        <Track x:Name="PART_Track" Orientation="Vertical" IsDirectionReversed="True">
                            <Track.Thumb>
                                <Thumb Style="{StaticResource MacScrollBarThumb}"/>
                            </Track.Thumb>
                        </Track>
                    </Grid>
                    <ControlTemplate.Triggers>
                        <Trigger Property="IsMouseOver" Value="True">
                            <Setter TargetName="GridRoot" Property="Width" Value="10"/>
                        </Trigger>
                    </ControlTemplate.Triggers>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

    <Style x:Key="MacScrollViewer" TargetType="ScrollViewer">
        <Setter Property="VerticalScrollBarVisibility"   Value="Auto"/>
        <Setter Property="HorizontalScrollBarVisibility" Value="Disabled"/>
        <Setter Property="Template">
            <Setter.Value>
                <ControlTemplate TargetType="ScrollViewer">
                    <Grid>
                        <Grid.ColumnDefinitions>
                            <ColumnDefinition Width="*"/>
                            <ColumnDefinition Width="Auto"/>
                        </Grid.ColumnDefinitions>
                        <ScrollContentPresenter Grid.Column="0"
                                                Margin="{TemplateBinding Padding}"
                                                HorizontalAlignment="Stretch"
                                                CanContentScroll="{TemplateBinding CanContentScroll}"/>
                        <ScrollBar x:Name="PART_VerticalScrollBar" Grid.Column="1" Orientation="Vertical"
                                   Style="{StaticResource MacScrollBar}"
                                   Value="{TemplateBinding VerticalOffset}"
                                   Maximum="{TemplateBinding ScrollableHeight}"
                                   ViewportSize="{TemplateBinding ViewportHeight}"
                                   Visibility="{TemplateBinding ComputedVerticalScrollBarVisibility}"/>
                    </Grid>
                </ControlTemplate>
            </Setter.Value>
        </Setter>
    </Style>

</ResourceDictionary>
`;
}

document.getElementById("export-btn").addEventListener("click", () => {

function showImportMsg(text, isError) {
  const msg = document.getElementById("import-msg");
  msg.textContent = text;
  msg.style.color = isError ? "#E8595F" : "var(--editor-accent)";
  msg.style.display = "inline";
  setTimeout(() => msg.style.display = "none", 3000);
}

function deepMerge(target, source) {
  Object.keys(source).forEach(key => {
    if (source[key] && typeof source[key] === "object" && !Array.isArray(source[key])) {
      if (!target[key] || typeof target[key] !== "object") target[key] = {};
      deepMerge(target[key], source[key]);
    } else {
      target[key] = source[key];
    }
  });
}

// Import seed43_palette.json - merges into DATA/DIMENSIONS rather than
// replacing them outright, so importing an older export that predates a
// newer token (e.g. pill_off_bg) leaves the current value for that token
// alone instead of wiping it to undefined.
document.getElementById("import-btn").addEventListener("click", () => {
  document.getElementById("import-file").click();
});
document.getElementById("import-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!imported.profiles || !imported.profiles.dark || !imported.profiles.light) {
        throw new Error("Missing profiles.dark / profiles.light");
      }
      deepMerge(DATA.dark, imported.profiles.dark);
      deepMerge(DATA.light, imported.profiles.light);
      if (imported.dimensions) deepMerge(DIMENSIONS, imported.dimensions);
      if (imported.active_profile === "dark" || imported.active_profile === "light") {
        activeColorProfile = imported.active_profile;
      }
      renderActiveTab();
      renderPreview();
      showImportMsg("Imported seed43_palette.json ✓", false);
    } catch (err) {
      showImportMsg("Import failed: " + err.message, true);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

// Import _icons.json - flat {key: path} shape, same as the real
// file. Merges into ICON_DATA (existing icons not present in the imported
// file are left alone), auto-generating a readable description for any
// imported key so the icon list still has something sensible to show,
// since descriptions aren't part of the real exported format.
document.getElementById("icon-import-btn").addEventListener("click", () => {
  document.getElementById("icon-import-file").click();
});
document.getElementById("icon-import-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (typeof imported !== "object" || Array.isArray(imported)) {
        throw new Error("Expected a flat {icon_key: path} object");
      }
      let count = 0;
      Object.keys(imported).forEach(key => {
        if (typeof imported[key] !== "string") return;
        const desc = key.split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
        ICON_DATA[key] = { description: (ICON_DATA[key] && ICON_DATA[key].description) || desc, path: imported[key] };
        count++;
      });
      if (activeTab === "icons") renderActiveTab();
      showImportMsg("Imported " + count + " icon(s) ✓", false);
    } catch (err) {
      showImportMsg("Import failed: " + err.message, true);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

let _highlightedEl = null;

let _activeComponent = null;

function clearComponentHighlight() {
  if (_highlightedEl) {
    _highlightedEl.classList.remove("component-highlighted");
    _highlightedEl = null;
  }
  document.querySelectorAll(".component-chip").forEach(c => c.classList.remove("active"));
  document.querySelectorAll(".row.token-highlighted").forEach(r => r.classList.remove("token-highlighted"));
  _activeComponent = null;
}

function applyTokenHighlights() {
  document.querySelectorAll(".row.token-highlighted").forEach(r => r.classList.remove("token-highlighted"));
  if (!_activeComponent) return;
  const keys = activeTab === "sizing" ? _activeComponent.dimKeys : _activeComponent.colorKeys;
  if (!keys || !keys.length) return;
  document.querySelectorAll("#editor-col .row").forEach(row => {
    if (keys.includes(row.dataset.token)) {
      row.classList.add("token-highlighted");
    }
  });
}

function highlightComponent(component, chip) {
  clearComponentHighlight();
  // Menu Dropdown is display:none unless open - force it open so there's
  // actually something to see and scroll to.
  if (component.label === "Menu Dropdown" && typeof setMenuOpen === "function") {
    setMenuOpen(true);
  }
  const el = document.querySelector(component.selector);
  if (el) {
    el.classList.add("component-highlighted");
    _highlightedEl = el;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  chip.classList.add("active");
  _activeComponent = component;
  applyTokenHighlights();
}

function renderComponentList() {
  const wrap = document.getElementById("component-list");
  wrap.innerHTML = "";
  COMPONENT_MAP.forEach(component => {
    const chip = document.createElement("div");
    chip.className = "component-chip";
    chip.textContent = component.label;
    chip.addEventListener("click", () => {
      if (chip.classList.contains("active")) {
        clearComponentHighlight();
      } else {
        highlightComponent(component, chip);
      }
    });
    wrap.appendChild(chip);
  });
}

// Menu dropdown - matches pyTransmit's real two-part mechanism exactly
// (options_btn_click / _options_popup_outside_click in pyTransmit.py):
//
// 1) Clicking the hamburger button is genuinely just "closed -> open it,
//    open -> close it". Nothing fancier. pyTransmit's real Popup uses
//    StaysOpen="True" specifically so WPF's own Popup auto-dismiss
//    behavior never fires and races against this handler - if it were
//    False, clicking the button to close an open menu would trigger BOTH
//    the Popup's own dismiss AND this click handler, which would then
//    immediately re-open what the dismiss just closed. StaysOpen="True"
//    removes that race entirely; closing is handled deliberately below
//    instead of automatically.
//
// 2) A separate outside-click listener (bound to the whole document here,
//    to the window's PreviewMouseDown in pyTransmit) closes the menu on
//    any click that lands outside it - except clicks on the button itself
//    or inside the popup's own content, which are explicitly excluded.
//    Without that exclusion, clicking the button to close the menu would
//    fire this handler too, closing it, and then the click handler above
//    would reopen it right back - the exact double-toggle bug this
//    two-handler split exists to avoid.
let menuOpen = false;
const menuBtn = document.getElementById("topbar-menu");
const menuWrap = document.getElementById("topbar-menu-wrap");
const menuPopupEl = document.getElementById("topbar-menu-popup");

function setMenuOpen(open) {
  menuOpen = open;
  menuBtn.classList.toggle("open", open);
  menuPopupEl.classList.toggle("open", open);
}

menuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  setMenuOpen(!menuOpen);
});

document.addEventListener("click", (e) => {
  if (!menuOpen) return;
  if (menuWrap.contains(e.target)) return; // button or popup itself
  setMenuOpen(false);
});

document.querySelectorAll(".pv-menu-item").forEach(el => {
  el.addEventListener("click", (e) => {
    e.stopPropagation();
    setMenuOpen(false);
  });
});

document.getElementById("accordion-header").addEventListener("click", (e) => {
  e.stopPropagation();
  accordionOpen = !accordionOpen;
  document.getElementById("accordion-header").classList.toggle("open", accordionOpen);
  document.getElementById("accordion-body").classList.toggle("open", accordionOpen);
  renderPreview();
});
