# seed43_migrations.yaml - lives in the repo root alongside version.txt.
#
# When a tool or folder is renamed, add an entry so the updater copies the
# user's .json config from the old location to the new one before syncing.
# Without an entry the old config is orphaned and the tool starts on defaults.
# Paths are relative to Seed43.tab. Parsed by lib/Snippets/_migrations.py.
#
# migrations:
#   - from: Old Panel.panel/Old Tool.pushbutton
#     to:   New Panel.panel/New Tool.pushbutton
#     subfolders:
#       - from: OldSubFolder
#         to:   NewSubFolder

migrations:

  # 2026-07-30: PyTables renamed to pyLink (carries userdata/section_groups.json).
  - from: Document Studio.panel/PyTables.pushbutton
    to:   Document Studio.panel/pyLink.pushbutton
    subfolders:
      - from: userdata
        to:   userdata

  # 2026-07-30: pyFilter moved out of the Filter Manager pulldown to the panel root.
  - from: Document Studio.panel/DocStack_1.stack/Filter Manager.pulldown/pyFilter.pushbutton
    to:   Document Studio.panel/pyFilter.pushbutton
    subfolders:
      - from: templates
        to:   templates
